name: Generate profile header

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_header.py"
      - ".github/workflows/generate-header.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate terminal animation
        run: python scripts/generate_header.py

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mission-briefing.gif
          if git diff --cached --quiet; then
            echo "Header is already up to date."
          else
            git commit -m "Generate mission briefing header"
            git push
          fi
